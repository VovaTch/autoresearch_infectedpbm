# Training configuration for the lvl1_vqgan music tokenizer.
#
# 48H GAN LEG (2026-08-12): fifth leg on the nonorm lineage, warm-started from
# saved_48h_lowlr/lvl1_vqgan_last.ckpt (1.8210 / 0.1015 / 1.0653 / 0.0115).
#
# WHY: the time+LR lever is exhausted. The 2e-5 leg was flat over 48h (its
# best-on-monitor checkpoint froze at hour 8) and the 1e-4 leg before it bought
# mrstft crumbs while cdpam regressed. Recon losses are saturated; the hard
# clips (0 and 2) degrade in cdpam monotonically across the whole lineage while
# their mrstft improves -- spectral accuracy bought at perceptual cost. The
# adversarial term optimizes something mrstft/cdpam cannot see.
#
# SINGLE VARIABLE = GAN ON. LR back to the continuation standard 1e-4 (it also
# drives the discriminator -- train.py:1522 and :1766 share
# learning_params.learning_rate -- and the disc loads at init, so it needs the
# fast LR more than the generator does). cdpam stays at weight 25: the GAN
# throttle is d_weight_cap, not the cdpam term (see below).
#
# d_weight_cap 1.0 -> 30. The adaptive weight is
# ||grad_rec|| / ||grad_gan|| clamped to the cap (train.py:1802). results.tsv
# records cap 30 as "~8% balanced pressure" and cap 100 as "~30%", so the raw
# ratio is ~375 and the baked cap of 1.0 runs the GAN at ~0.3% of balanced --
# i.e. "on" at cap 1.0 does nothing. Cap 30 is the only config in the log to
# improve cdpam AND mrstft together (0.1539->0.1356, 1.670->1.623); cap 1e4
# unconstrained regressed everything (chroma +34%).
#
# Disc lead-in: gan_start_step 1000 (disc begins training), disc_warmup 2000
# (disc trains alone), so adversarial pressure reaches the generator at step
# 3000 (~26 min at ~1.9 it/s). disc_warmup was hardcoded to 0 before today;
# it is now wired through this config block.
#
# WATCH: chroma (currently all-time best 0.0115) gave back ~12% in the cap-30
# probe. cdpam is NOT the judge here -- FINDINGS say GAN sounds better to the
# ear while scoring worse on cdpam, so the ear A/B decides. Also note the
# cap-30 probe ran 4h on the old l2 lineage from a 10h checkpoint; transfer to
# this 134h nonorm lineage is likely but unproven. Abort signal: disc loss
# collapsing to ~0 early (disc winning outright, generator gradient vanishes)
# -> lower d_weight_cap or delay gan_start_step, do NOT drop the LR.
#
# Lineage after this run: ~182h.


model:
  hidden: 1024          # temporal conv channel width (Res1DBlocks)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 3             # residual quantization depth (codes per latent frame)
  num_tokens: 2048      # codebook entries per RQ level
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)
  ze_norm: none         # unconstrained z_e (baseline default)

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 1000  # step the discriminator starts training
  disc_warmup: 2000     # disc trains alone this many steps; adversarial at 3000
  d_weight_cap: 30.0    # ~8% of balanced adversarial pressure (probe-best)
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 2880         # full 48h leg (true wall clock), same as previous legs
  lr: 1.0e-4            # one-cycle peak (continuation convention); drives disc too
  lr_pct_start: 0.05    # short warmup, weights already trained
  lr_div_factor: 50     # initial lr = peak / 50 = 2e-6
  batch_size: 24        # keep baseline batch
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: saved_48h_gan/
  checkpoint: saved_48h_lowlr/lvl1_vqgan_last.ckpt
