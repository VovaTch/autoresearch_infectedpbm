# Training configuration for the lvl1_vqgan music tokenizer.
#
# 48H GAN ANNEAL 2 (2026-08-16): second, stronger repair pass. Parent is
# saved_24h_gan_anneal/lvl1_vqgan_last.ckpt (1.9054 / 0.1023 / 1.1494 / 0.0137).
#
# WHY MORE OF THE SAME: the first anneal (config_cont24h_gan_anneal.yaml, cap
# 10, 24h) was a partial pass, not a failure. Measured over 12 peak-normalized
# render clips (Hann window):
#   model        RMS    crest dB   0.5-5k    >5kHz   centroid
#   ORIG        0.2673    11.88    0.2298   0.01352     0.6
#   lowlr48h    0.2052    14.16    0.1985   0.01108     0.5
#   gan48h      0.1748    15.45    0.2295   0.01300     0.6
#   ganAnneal   0.1815    15.09    0.2242   0.01273     0.6
# Crest closed only 28% of the gap back to lowlr48h and RMS recovered ~22%,
# but HF held at 0.01273 = ~87% of the GAN spectral win retained, centroid
# still 0.6. The feared failure mode (recon pressure dragging HF back to
# ~0.0111 while fixing crest) did NOT occur, so the transient artifacts and
# the spectral restoration are SEPARABLE. The anneal was simply too weak.
#
# THIS RUN: same recipe, more dose. d_weight_cap 10 -> 5, 24h -> 48h, peak LR
# unchanged at 2e-5. The cap change is real and sustained: d_weight over the
# first anneal started at 4.48 (BELOW cap 10, not binding), rose through 8.07,
# and ended pinned at 10 -- so cap 10 only started limiting late. Cap 5 binds
# from step 0 and stays bound for the whole run.
#
# gan_start_step 0 / disc_warmup 0: the disc is trained and carries over via
# the strict=False load (the "discriminator left at init" line printed at
# startup is a hardcoded string, train.py:2480, not a report).
#
# SUCCESS CRITERIA (rerun the crest/spectral analysis on fresh renders):
# crest continuing toward lowlr48h's 14.16 dB and RMS toward 0.2052, WHILE
# >5kHz stays near 0.0127 and centroid stays 0.6. FAILURE MODE: HF collapsing
# toward 0.0111 -- that would mean cap 5 has finally cut adversarial pressure
# below what sustains the spectral win, and the next move is a transient/crest
# penalty term rather than further cap reduction.
#
# KNOWN RESISTANCE: crest repair was non-uniform in the first anneal -- clip9
# (12.87 -> 15.16) and clip0 (17.56 -> 18.41) got WORSE while the rest
# improved. If those two resist again at cap 5, the artifact on them is not
# adversarial-pressure-driven and needs separate diagnosis.
#
# Lineage after this run: ~254h.


model:
  hidden: 1024          # temporal conv channel width (Res1DBlocks)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 3             # residual quantization depth (codes per latent frame)
  num_tokens: 2048      # codebook entries per RQ level
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)
  ze_norm: none         # unconstrained z_e (baseline default)

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 0     # disc is already trained; no lead-in needed
  disc_warmup: 0        # adversarial pressure live from step 0
  d_weight_cap: 5.0     # binds from step 0 (first anneal ran 4.48 -> pinned 10)
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 2880         # 48h repair pass (true wall clock)
  lr: 2.0e-5            # one-cycle peak; anneal, not exploration
  lr_pct_start: 0.05    # short warmup, weights already trained
  lr_div_factor: 50     # initial lr = peak / 50 = 4e-7
  batch_size: 24        # keep baseline batch
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: saved_48h_gan_anneal2/
  checkpoint: saved_24h_gan_anneal/lvl1_vqgan_last.ckpt
