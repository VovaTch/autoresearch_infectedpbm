# Style-AR, FINAL run for the slice synthesizer: the config_style_ar.yaml recipe
# with NO held-out tracks, so all 53 ids have a trained embedding row (a
# held-out id falls back to the null row in the GUI). There is no honest
# validation here -- val/nll is a training track -- so the wall time is capped
# where the ho5 run's held-out nll bottomed out (step ~1600, about 1.5 min into
# a 30-min one-cycle; 4 min here gives that plus the anneal). Sampling knob from
# the ho5 report: ar_temperature 1.2 matches the corpus diversity (1.0 hugs the
# mean, 1.5 is too wide).
#
#   CUDA_VISIBLE_DEVICES=1 setsid nohup uv run python train_style_ar.py \
#     --config config_style_ar_all.yaml > logs/train_style_ar_all.log 2>&1 &

data:
  token_cache: ~/.cache/infected_pbm/tokens_88cacecb1e81
  held_out_tracks: 0        # every track gets a trained id row; val reuses a training track
  split_seed: 1234
  pca_dims: 24               # 99% of the variance; recon cosine 0.996 (min 0.94) on held-out
  pca_eig_floor: 1.0e-4
  phases: 4                 # grids shifted by 0/128/256/384 frames
  crop_positions: 128       # ~6.3 min of slices; the longest track is 216
  min_crop: 8
  steps_per_epoch: 200      # x batch 64 = 12800 crops per epoch

model:
  d_model: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.3
  mog_components: 8
  log_std_min: -5.0
  log_std_max: 2.0
  p_drop_id: 0.3            # null id 30% of the time -> CFG at sampling
  input_noise: 0.3          # 3-min sweep: val nll/dim 1.12 -> 0.97 with d128/L3/drop0.3/noise0.3
  rope_theta: 10000.0

train:
  devices: 1
  minutes: 4                # ho5 held-out nll bottomed ~1600 steps (~1.5 min) in, then memorised
  lr: 3.0e-4
  lr_pct_start: 0.05
  lr_div_factor: 25
  batch_size: 64
  accumulate_grad_batches: 1
  precision: 32-true
  weight_decay: 0.05
  grad_clip: 1.0
  num_workers: 2
  ema_decay: 0.999
  seed: 42
  save_path: saved_style_ar_20260916_all/
  checkpoint: null
