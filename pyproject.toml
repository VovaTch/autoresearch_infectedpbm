[project]
name = "autoresearch-infectedpbm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cdpam>=0.0.6",
    "resampy>=0.4.3",
    "scipy>=1.17.1",
    "librosa>=0.11.0",
    "gdown>=6.0.0",
    "ipython>=9.13.0",
    "lightning>=2.6.1",
    "matplotlib>=3.10.9",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.11.1",
    "tqdm>=4.67.3",
    "ipykernel>=7.3.0",
    "pyside6>=6.11.2",
    "pyloudnorm>=0.2.0",
    "soundfile>=0.13.1",
]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "notebook>=7.6.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxruntime-gpu>=1.29.0",
    "onnxscript>=0.7.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
