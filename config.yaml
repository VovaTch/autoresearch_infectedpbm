# Training configuration for the lvl1_vqgan music tokenizer.
#
# FINE-TUNE A (2026-07-06): ear-quality rebalance test. 60-min fine-tune from
# the 19.75h long-run checkpoint (commit 8f70d40, cdpam 0.1066 / mrstft 2.20 —
# user ear check: sounds bad, spectral fidelity suspected). Only change vs long
# run: CDPAM loss weight 100 -> 25 (train.py). GAN active from step 0 (fresh
# trainer step counter; disc weights load from the checkpoint). Checkpoints go
# to saved_ft_a/ so the base checkpoint in saved/ stays intact.

model:
  hidden: 1024          # temporal conv channel width (user: wider for long horizon)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 2             # residual quantization depth (RQ2 beat RQ3 at 15 min)
  num_tokens: 2048      # codebook entries per RQ level
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 0     # fine-tune: GAN on immediately (step counter resets on weight-load)
  d_weight_cap: 1.0     # upper clamp on the adaptive adversarial weight
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 60           # wall-clock training budget (fine-tune step)
  lr: 1.0e-4            # one-cycle peak learning rate (fine-tune: lower than long-run peak)
  lr_pct_start: 0.15    # one-cycle warmup fraction
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: saved_ft_a/  # keep base long-run checkpoint in saved/ untouched
  checkpoint: saved/lvl1_vqgan_last.ckpt  # weights from the 19.75h long run
