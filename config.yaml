# Training configuration for the lvl1_vqgan music tokenizer.
#
# PREPARED FOR LONG RUN (2026-07-05) — not yet launched.
# Recipe = jul2-jul5 15-min loop best (commit dc336f0): sep-convs, BiGRU
# bottleneck, mag input channel, decoder-heavy depth, RQ2, cdpam w100.
# Open decisions before launch (see FINDINGS_jul2_15min_loop.md):
#   - hidden 512 vs 1024: 512 won at 15 min, but capacity ceiling evidence says
#     wider may win at this horizon.
#   - peak LR 3.5355e-4 was tuned at 15 min; previous long runs used 1.4142e-4.
#     TimeOneCycleLR stretches the schedule automatically, but the peak may be
#     hot for 14h — watch align/commit early.
#   - gan_start_step 20000 WILL be reached in a long run (GAN engages). Memory:
#     GAN sounded better by ear despite worse cdpam. Raise to disable.

model:
  hidden: 512           # temporal conv channel width (15-min winner; see note above)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 2             # residual quantization depth (RQ2 beat RQ3 at 15 min)
  num_tokens: 2048      # codebook entries per RQ level
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 20000 # step the discriminator engages (reachable in long run!)
  d_weight_cap: 1.0     # upper clamp on the adaptive adversarial weight
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 870          # wall-clock training budget (14.5h, excludes startup/eval)
  lr: 3.5355e-4        # one-cycle peak learning rate (see LR note above)
  lr_pct_start: 0.15    # one-cycle warmup fraction
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: null       # checkpoint/log dir override; null = default ("saved/")
  checkpoint: null       # resume weights from this checkpoint; null = train from scratch
