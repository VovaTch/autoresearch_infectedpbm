# Training configuration for the lvl1_vqgan music tokenizer.
#
# BASELINE (2026-07-16): nonorm-lineage reset. Current best model =
# saved_12h_nonorm/ (composite 2.022 / cdpam 0.1007 / mrstft 1.234 / chroma
# 0.0163, 15h lineage, ear-confirmed). Produced by: 3h from scratch with the
# fixed codebook gradient (84e7cb5) + ze_norm none, then 12h continuation
# (config_cont12h_nonorm.yaml). This file = the from-scratch recipe of that
# lineage; continuations should warm-start saved_12h_nonorm and follow the
# one-cycle continuation convention (peak ~1e-4, div 50, pct 0.05).


model:
  hidden: 1024          # temporal conv channel width (Res1DBlocks)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 3             # residual quantization depth (codes per latent frame)
  num_tokens: 2048      # codebook entries per RQ level
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)
  ze_norm: none         # unconstrained z_e (default; l2/grms lost the norm race)

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 100000000 # GAN OFF
  d_weight_cap: 1.0     # upper clamp on the adaptive adversarial weight
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 180          # from-scratch leg of the baseline lineage
  lr: 1.4142e-4         # one-cycle peak (from-scratch recipe)
  lr_pct_start: 0.1     # one-cycle warmup fraction
  lr_div_factor: 25     # initial lr = peak / 25
  batch_size: 24        # 2x the legacy default; fits in 24GB with headroom
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: saved/
  checkpoint: null      # FROM SCRATCH
