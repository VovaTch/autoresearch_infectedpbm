# Training configuration for the lvl1_vqgan music tokenizer.
#
# 2026-08-21 PER-LEVEL LEG 2: 24h continuation of the per-level codebook
# lineage. Parent is saved_24h_perlevel/lvl1_vqgan_last.ckpt
# (1.7762 / 0.0985 / 1.0317 / 0.0110 -- all-time best composite, mrstft and
# chroma; cdpam second-best ever behind 24h_nonorm's 0.0967).
#
# WHY CONTINUE RATHER THAN TURN THE GAN ON: three independent signals say the
# first per-level leg was cut off mid-climb, not converged.
#   - lvl1_vqgan_best.ckpt == last.ckpt (monitored metric still improving at
#     24h; compare lowlr48h, whose best froze at hour 8 of 48).
#   - validation/mrstft fell monotonically 1.112 -> 1.031 and was still
#     falling at the end.
#   - dead codes fell monotonically 1682 -> 137.5 of 6144 and were still
#     falling. The 1682 spike at epoch 0 was the expected reorganization:
#     three identical tables, so the fine levels initially crowd onto the few
#     small-norm codes before specializing. 2.2% dead is converging, not
#     starving -- the starvation fallback (per-level residual normalization
#     against a shared table) is NOT needed.
#
# THE GAN IS STILL REQUIRED, JUST NOT YET. Per-level codebooks fixed
# quantization error (align/commit 2.27 -> 1.11) but did NOTHING for the
# spectral tilt: perlevel24h measures >5kHz 0.01143, mid 0.1988, centroid 0.5
# -- indistinguishable from GAN-off lowlr48h (0.01108 / 0.1985 / 0.5) against
# an original of 0.01352 / 0.2298 / 0.6. Only the adversarial term has ever
# moved that axis (gan48h reached 0.01300 / 0.2295 / 0.6). The two levers are
# orthogonal; the end state needs both. Running the GAN now would apply
# adversarial pressure to a quantizer still reorganizing, and would confound
# attribution in exactly the way this lineage's paired single-variable design
# exists to prevent. The trained discriminator is already carried in the
# parent checkpoint (loaded but unused for 24h), so enabling it later is cheap.
#
# Single variable vs the parent leg: nothing but more wall clock. Same peak
# 1e-4, div 50, pct 0.05, GAN off, batch 24, per-level codebooks, 2 GPUs.
#
# Lineage after this run: ~302h.


model:
  hidden: 1024          # temporal conv channel width (Res1DBlocks)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 3             # residual quantization depth (codes per latent frame)
  num_tokens: 2048      # codebook entries PER LEVEL
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)
  ze_norm: none         # unconstrained z_e (baseline default)
  per_level_codebooks: true  # each RQ level owns its own codebook

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 100000000 # GAN OFF
  disc_warmup: 0        # unused with the GAN off
  d_weight_cap: 1.0     # unused with the GAN off
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 1440         # 24h leg (true wall clock)
  lr: 1.0e-4            # one-cycle peak (continuation convention)
  lr_pct_start: 0.05    # short warmup, weights already trained
  lr_div_factor: 50     # initial lr = peak / 50 = 2e-6
  batch_size: 24        # keep baseline batch
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: saved_20260821_perlevel/
  checkpoint: saved_24h_perlevel/lvl1_vqgan_last.ckpt
