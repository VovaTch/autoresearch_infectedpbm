# Training configuration for the lvl1_vqgan music tokenizer.
#
# 48H LOW-LR CONTINUATION (2026-08-08): fourth leg on the nonorm lineage,
# warm-started from saved_48h_nonorm_resume/lvl1_vqgan_last.ckpt (composite
# 1.8227 / cdpam 0.0998 / mrstft 1.0678 / chroma 0.0115 -- composite, mrstft
# and chroma all-time best; cdpam a hair behind the 24h leg's 0.0967).
#
# Single variable vs the previous leg: the one-cycle peak LR is 1/5 of the
# previous maximum (2e-5 instead of 1e-4). Everything else is held fixed --
# same 2880 min wall clock, div 50 (initial lr 4e-7), pct 0.05, GAN off,
# batch 24, 2 GPUs. Question: does a gentler peak keep refining the tail
# (esp. cdpam) instead of re-heating the weights early in the cycle?
# Lineage after this run: ~134h.


model:
  hidden: 1024          # temporal conv channel width (Res1DBlocks)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 3             # residual quantization depth (codes per latent frame)
  num_tokens: 2048      # codebook entries per RQ level
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)
  ze_norm: none         # unconstrained z_e (baseline default)

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 100000000 # GAN OFF
  d_weight_cap: 1.0     # upper clamp on the adaptive adversarial weight
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 2880         # full 48h leg (true wall clock), same as previous leg
  lr: 2.0e-5            # one-cycle peak = 1/5 of the previous 1e-4
  lr_pct_start: 0.05    # short warmup, weights already trained
  lr_div_factor: 50     # initial lr = peak / 50 = 4e-7
  batch_size: 24        # keep baseline batch
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: saved_48h_lowlr/
  checkpoint: saved_48h_nonorm_resume/lvl1_vqgan_last.ckpt
