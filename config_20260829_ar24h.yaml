# 2026-08-29 RESTART of config_20260828_ar24h.yaml. Identical hyperparameters;
# only save_path changed. The 2026-08-28 leg was abandoned at ~11k steps because
# it was retaining nothing: ModelCheckpoint(monitor="val/loss", save_last=True)
# gates last.ckpt on a top-k save actually firing (model_checkpoint.py:516), and
# val/loss bottomed at step 1499 then rose monotonically, so both ar_best.ckpt
# and last.ckpt froze at 22:38 while training ran on for two more hours.
# on_train_end does not rescue it either -- it saves only when
# _last_checkpoint_saved is falsy, and it was not.
#
# train_ar.py now carries three independent save paths:
#   1. ar_best.ckpt   -- monitored on val/loss, no save_last (see above)
#   2. ar_latest.ckpt + last.ckpt -- unmonitored, every epoch, save_on_exception
#   3. ar_final.ckpt  -- explicit trainer.save_checkpoint after fit returns,
#                        because Timer stops mid-epoch and the epoch-end
#                        callback would miss the final partial epoch
#
# Expect ar_best to stay pinned near step ~1500 again. That is not a failure;
# at 6.25 h of corpus and 94.7 M params val CE is a memorization thermometer,
# not a model selector. Judge this run from ar_final/last, by ear.
#
# Command (detached, per the power-loss finding):
#   CUDA_VISIBLE_DEVICES=0 setsid nohup uv run python -u train_ar.py \
#     --config config_20260829_ar24h.yaml > logs/train_ar24h_v2.log 2>&1 &

tokenizer:
  encoder_onnx: onnx/encoder.onnx
  meta: onnx/tokenizer_meta.json
  checkpoint: saved_20260827_cont9h/lvl1_vqgan_last.ckpt  # codebook source
  tracks_dir: ~/.cache/infected_pbm/tracks
  slices_dir: ~/.cache/infected_pbm/slices  # fallback for 7 mp3s torchcodec rejects
  cache_root: ~/.cache/infected_pbm
  chunk_frames: 4096    # frames emitted per encoder window
  margin: 256           # context frames discarded per side; trunk RF is ~120
  verify_tolerance: 0.005  # argmax near-tie floor; level 0 must still be exact

data:
  crop_frames: 4096     # 23.8 s @ 172.27 fps
  frames_per_pos: 1     # >1 folds F frames into one position; F=1 is the tested path
  style_window_sec: 10.0
  val_frac: 0.04        # held-out share per track
  val_windows_per_track: 2
  min_val_window: 512
  split_seed: 1234      # split depends on data only, never on the model
  track_weighting: length
  steps_per_epoch: 500  # an "epoch" is a logging interval, not a corpus pass
  single_track: null    # substring filter, for the one-track overfit check

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  dropout: 0.0
  style_bottleneck: 128 # keeps the style stream low-bandwidth (section 11.3)
  p_drop_cond: 0.1      # per-stream, independent coins (section 11.2)
  rope_theta: 10000.0

train:
  devices: 1
  minutes: 1440
  lr: 3.0e-4
  lr_pct_start: 0.05
  lr_div_factor: 25
  batch_size: 8
  precision: bf16-mixed
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 4
  ema_decay: null
  seed: 42
  save_path: saved_ar_20260829_24h/
  checkpoint: null
