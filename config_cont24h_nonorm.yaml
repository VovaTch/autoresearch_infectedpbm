# Training configuration for the lvl1_vqgan music tokenizer.
#
# 24H NONORM CONTINUATION (2026-07-16): second 12h leg on the baseline
# lineage — resume saved_12h_nonorm (composite 2.022 / cdpam 0.1007 /
# mrstft 1.234 / chroma 0.0163, ear-confirmed baseline). Continuation
# convention: fresh one-cycle peak 1e-4, div 50, pct 0.05, GAN off,
# batch 24. 720 min. Total lineage after this run: ~27h.


model:
  hidden: 1024          # temporal conv channel width (Res1DBlocks)
  token_dim: 1024       # VQ latent / codebook token dimension
  num_rq: 3             # residual quantization depth (codes per latent frame)
  num_tokens: 2048      # codebook entries per RQ level
  time_downsample: 1    # latent time downsample (1 -> 128 frames/slice, 172 fps)
  ze_norm: none         # unconstrained z_e (baseline default)

vq:
  commit_weight: 0.75   # commitment loss weight (anchors z_e to the codebook)

gan:
  gan_start_step: 100000000 # GAN OFF
  d_weight_cap: 1.0     # upper clamp on the adaptive adversarial weight
  disc_width: 1         # discriminator channel multiplier

train:
  devices: 2            # GPUs: integer count, "auto" (all visible), or a list like [0,1]
  minutes: 720          # 12h continuation
  lr: 1.0e-4            # one-cycle peak (continuation convention)
  lr_pct_start: 0.05    # short warmup, weights already trained
  lr_div_factor: 50     # initial lr = peak / 50 = 2e-6
  batch_size: 24        # keep baseline batch
  single_song: null     # substring filter for single-song overfit; null = full dataset
  save_path: saved_24h_nonorm/
  checkpoint: saved_12h_nonorm/lvl1_vqgan_last.ckpt
